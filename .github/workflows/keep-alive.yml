name: Keep Render Awake

on:
  schedule:
    # Ping every 5 minutes, offset from the top of the hour to reduce scheduling delays.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out the keep-alive script
        uses: actions/checkout@v4

      - name: Wake Render and verify the health endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL || 'https://veilchat.onrender.com' }}
          KEEP_ALIVE_MAX_ATTEMPTS: "4"
          KEEP_ALIVE_RETRY_DELAY_MS: "20000"
          KEEP_ALIVE_TIMEOUT_MS: "60000"
        run: node scripts/keep-render-awake.mjs
